name: One-time Actions artifact cleanup

on:
  push:
    paths:
      - '.github/workflows/storage-cleanup-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest artifact of each name and delete older copies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          page=1
          while :; do
            data="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100&page=$page")"
            count="$(jq '.artifacts | length' <<<"$data")"
            if [ "$count" -eq 0 ]; then
              break
            fi
            jq -r '.artifacts[] | select(.expired == false) | [.id, .name, .size_in_bytes, .created_at] | @tsv' <<<"$data" >> "$tmp"
            page=$((page + 1))
          done

          declare -A seen
          deleted=0
          deleted_bytes=0
          kept=0

          while IFS=$'\t' read -r id name size created; do
            [ -z "${id:-}" ] && continue
            if [ -n "${seen[$name]:-}" ]; then
              gh api --method DELETE "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              deleted=$((deleted + 1))
              deleted_bytes=$((deleted_bytes + size))
            else
              seen[$name]=1
              kept=$((kept + 1))
            fi
          done < "$tmp"

          echo "CLEANUP_RESULT deleted=$deleted bytes=$deleted_bytes kept=$kept"
